name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir: ['1.15', '1.17']
        otp: ['26', '27']
        include:
          - elixir: '1.20'
            otp: '29'
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          # No restore-keys: a cache built against an older lockfile can contain
          # stale compiled dependencies and break `mix compile`.
          key: ${{ runner.os }}-build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v6
        with:
          path: _build/plt
          key: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Static analysis (Credo)
        run: mix credo --min-priority high

      - name: Type checking (Dialyzer)
        run: mix dialyzer

      - name: Smoke test (route-level acceptance)
        run: mix run scripts/smoke_test.exs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Reject project-level advisory ignores
        run: |
          if grep -n "ignore_advisories" mix.exs; then
            echo "::error file=mix.exs::ignore_advisories is not allowed in CI; fix the dependency instead."
            exit 1
          fi

      - name: Audit dependencies for known CVEs
        run: mix hex.audit
